[project]
name = "suplex-ai"
version = "0.1.0"
description = "Agent-driven lead scraping, enrichment, and email verification pipeline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "playwright>=1.58",
    "apify-client>=2.5,<3",
    "httpx>=0.28",
    "selectolax>=0.3",
    "extruct>=0.18",
    "trafilatura>=2.0",
    "anyio>=4.9",
    "psutil>=6.0",
    "anthropic>=0.52,<1",
    "email-validator>=2.2",
    "mcp[cli]>=1.9,<2",
    "click>=8.1",
    "pydantic>=2.11",
]

[project.scripts]
suplex = "suplex.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/suplex"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.11",
]
