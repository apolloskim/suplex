name: Build & Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macos
            arch: arm64
            ext: ""
          - os: ubuntu-latest
            platform: linux
            arch: x64
            ext: ""
          - os: windows-latest
            platform: windows
            arch: x64
            ext: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build binary
        run: uv run pyinstaller suplex.spec --clean

      - name: Rename binary (unix)
        if: runner.os != 'Windows'
        run: mv dist/suplex dist/suplex-${{ matrix.platform }}-${{ matrix.arch }}

      - name: Rename binary (windows)
        if: runner.os == 'Windows'
        run: mv dist/suplex.exe dist/suplex-${{ matrix.platform }}-${{ matrix.arch }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: suplex-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/suplex-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/suplex-*
          generate_release_notes: true
